name: Build Shizuku diagnostics APK

on:
  push:
    branches:
      - shizuku-diagnostics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 34 platform
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate isolated CI debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-signing
          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/.ci-signing/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 3650 -noprompt
          printf 'storeFile=%s\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n' \
            "$GITHUB_WORKSPACE/.ci-signing/debug.keystore" > application/keystore.properties

      - name: Test Shizuku port parsing and scan diff
        working-directory: application
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK (diagnostics only)
        working-directory: application
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PortGuard-Shizuku-Diagnostics-debug
          path: application/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
